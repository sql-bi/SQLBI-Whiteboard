  </g>

  <g font-family="Segoe UI Variable Display, Segoe UI, sans-serif" fill="#15171C">
    <text x="80" y="306" font-size="70" font-weight="700" letter-spacing="-2.5">The whiteboard for <tspan fill="#D82121">teaching</tspan></text>
    <text x="80" y="368" font-size="27" fill="#5C6371">DAX, SQL, data modeling, and anything else you explain to people.</text>
    <text x="80" y="412" font-size="27" fill="#5C6371">A native Windows application for pen, touch, and live capture.</text>
    <text x="80" y="572" font-size="26" font-weight="600" fill="#B71D1D">whiteboard.sqlbi.com</text>
  </g>

