<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="SQLBI Whiteboard — the whiteboard for teaching. whiteboard.sqlbi.com">
  <title>SQLBI Whiteboard</title>
  <!-- The evergreen card, in the same language as the site: grid ground, one red
       accent, the application tile. hero-launch-card.svg is the campaign one. -->
  <defs>
    <linearGradient id="tile" x1="80" y1="72" x2="200" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F42727"/><stop offset="1" stop-color="#B71D1D"/>
    </linearGradient>
    <radialGradient id="fade" cx="0.34" cy="0.42" r="0.72">
      <stop offset="0.3" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#F42727" stop-opacity=".10"/><stop offset="1" stop-color="#F42727" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#15171C" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FAFAFB"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <ellipse cx="330" cy="250" rx="520" ry="380" fill="url(#glow)"/>

  <g transform="translate(80 72) scale(0.46875)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
    <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
