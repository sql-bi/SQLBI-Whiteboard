<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Microsoft is retiring its Whiteboard app on 14 September 2026. SQLBI Whiteboard is the answer, shown in its real window: a captured Power BI matrix with highlighter marks, a DAX measure, and red pen annotations.">
  <title>Hold my beer</title>
  <!-- The landscape companion to hero-launch.svg, laid out for a 1200x630 social
       card rather than cropped from the square artwork. The application window is
       drawn from the Store listing screenshots: same chrome, same floating palette,
       same captured matrix and DAX panel, with the type enlarged so it survives the
       downscale to a feed thumbnail. -->
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="520" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1B33"/><stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <clipPath id="winclip"><rect x="0" y="0" width="1400" height="900" rx="14"/></clipPath>
    <filter id="winshadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0A1B33" flood-opacity="0.30"/>
    </filter>
    <filter id="panelshadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A1B33" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F7F6F2"/>
  <rect width="520" height="630" fill="url(#left)"/>

  <!-- Left panel: the announcement, quoted -->
  <g font-family="Segoe UI Variable Display, Segoe UI, sans-serif" fill="#FFFFFF">
    <g>
      <rect x="56" y="46" width="26" height="26" fill="#F25022"/>
      <rect x="87" y="46" width="26" height="26" fill="#7FBA00"/>
      <rect x="56" y="77" width="26" height="26" fill="#00A4EF"/>
      <rect x="87" y="77" width="26" height="26" fill="#FFB900"/>
      <text x="131" y="84" font-size="38" font-weight="600">Microsoft</text>
    </g>

    <text x="56" y="212" font-size="44" font-weight="700">&#8220;We are going</text>
    <text x="56" y="266" font-size="44" font-weight="700">to retire the</text>
    <text x="56" y="320" font-size="44" font-weight="700">Whiteboard app&#8221;</text>

    <path d="M56 376h360" stroke="#2B4266" stroke-width="3"/>
    <path d="M228 376l12-12 12 12-12 12z" fill="#3E5C8A"/>

    <text x="56" y="432" font-size="23" fill="#B9C7DA">Retiring soon. Thank you for</text>
    <text x="56" y="463" font-size="23" fill="#B9C7DA">using Microsoft Whiteboard.</text>

    <g transform="translate(56 552)">
      <rect x="0" y="-26" width="36" height="36" rx="7" fill="none" stroke="#8FA5C4" stroke-width="3"/>
      <path d="M0 -14h36M10 -26v-8M26 -26v-8" stroke="#8FA5C4" stroke-width="3"/>
      <text x="54" y="-8" font-size="23" fill="#DCE4EE">Effective date:</text>
      <text x="54" y="22" font-size="23" font-weight="600">September 14, 2026</text>
    </g>
  </g>

  <!-- Right panel: the reply -->
  <g transform="translate(576 33) scale(0.16967)">
    <path d="M349.1,111.4c0-18.8-77.3-33.1-173.3-33.1S2.4,92.7,2.4,110.3v265c0,18.8,79.5,33.1,175.5,33.1s173.3-15.5,173.3-33.1V109.2ZM107.3,356.5c-23.2-2.2-46.4-4.4-69.6-7.7V310.2c23.2,2.2,46.4,4.4,69.6,5.5Zm103.8,2.3q-34.8,1.65-69.6,0V204.2h69.6Zm102.6-10c-23.2,3.3-46.4,6.6-69.6,7.7V243.9c23.2,0,46.4-1.1,69.6-2.2Z" style="fill:#eb5e5e"/><path d="M177.9,78.3c96.1,0,173.3,14.4,173.3,30.9s-77.3,30.9-173.3,30.9S2.4,125.8,2.4,109.2,81.9,78.3,177.9,78.3Z" style="fill:#d35455"/><path d="M481.6,293.6a197.51,197.51,0,0,0,88.3,21c25.4,0,54.1-4.4,54.1-21,0-17.7-26.5-26.5-55.2-30.9-42-6.6-100.5-18.8-100.5-80.6,0-62.9,56.3-79.5,110.4-79.5,49.7,0,82.8,14.4,101.6,25.4l-18.8,51.9c-15.5-9.9-46.4-21-82.8-21-25.4,0-48.6,5.5-48.6,21,0,19.9,32,21,49.7,23.2,74,12.1,106,43.1,106,91.6,0,62.9-66.2,75.1-115.9,75.1-45.3,0-81.7-11-107.1-25.4C462.8,345.5,481.6,293.6,481.6,293.6ZM939.7,493.4H877.9v-127c-12.1,5.5-27.6,6.6-43.1,6.6-72.9,0-128.1-40.9-128.1-131.4V234c0-87.2,51.9-131.4,128.1-131.4,21,0,70.7,3.3,104.9,23.2V493.4Zm-170-251.7c0,61.8,28.7,75.1,69.6,75.1,18.8,0,32-3.3,38.6-7.7V166.6c-9.9-4.4-22.1-7.7-40.9-7.7-42,0-67.3,14.4-67.3,75.1v7.7ZM977.3,6.6h64V374.3h-64V6.6Z" style="fill:#4b4a4b"/><path d="M1077.8,6.6h61.8V109.3c12.1-5.5,27.6-6.6,43.1-6.6,72.9,0,128.1,40.9,128.1,131.4v7.7c0,88.3-51.9,131.4-128.1,131.4-21,0-70.7-3.3-104.9-23.2Zm171,227.3c0-61.8-29.7-76.1-70.6-76.1-17.7,0-32,4.4-37.5,7.7V308c8.8,4.4,22.1,7.7,40.9,7.7,42,0,67.3-14.4,67.3-75.1ZM1377,6.6c21,0,37.5,15.5,37.5,35.3s-16.6,36.4-37.5,36.4c-19.9,0-37.5-16.6-37.5-36.4S1356,6.6,1377,6.6Zm-31,109.3h61.8V373.1H1346V115.9Z" style="fill:#eb5e5e"/>
  </g>
  <text x="576" y="196" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" fill="#0A1B33"
        font-size="56" font-weight="700" font-style="italic">Hold my beer&#8230;</text>
  <path d="M580 219c94-11 188-11 282 2" stroke="#0A1B33" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- The application window, as it really is: Windows chrome, menu bar, a captured
       Power BI matrix, the floating pen palette, and a DAX panel with ink on top.
       Drawn at 1400x900 (the default window size) and bled off the bottom-right. -->
  <g transform="translate(556 250) scale(0.485)">
    <rect x="0" y="0" width="1400" height="900" rx="14" fill="#FFFFFF" filter="url(#winshadow)"/>
    <g clip-path="url(#winclip)">
      <!-- title bar -->
      <rect x="0" y="0" width="1400" height="56" fill="#2B7CD3"/>
      <rect x="16" y="14" width="28" height="28" rx="7" fill="#D82121"/>
      <path d="M23 32c4-6 10-8 14 -3" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <text x="58" y="37" font-family="Segoe UI, sans-serif" font-size="24" fill="#FFFFFF">SQLBI Whiteboard</text>
      <g stroke="#FFFFFF" stroke-width="2.4" fill="none">
        <path d="M1272 28h20"/>
        <rect x="1322" y="19" width="18" height="18" rx="2"/>
        <path d="M1374 19l18 18M1392 19l-18 18"/>
      </g>

      <!-- menu bar -->
      <rect x="0" y="56" width="1400" height="52" fill="#FFFFFF"/>
      <g font-family="Segoe UI, sans-serif" font-size="24" fill="#1A1A1A">
        <text x="30" y="91">File</text>
        <text x="112" y="91">Edit</text>
        <text x="198" y="91">View</text>
        <text x="292" y="91">Help</text>
      </g>

      <!-- captured live view: a Power BI matrix -->
      <g font-family="Segoe UI, sans-serif" font-size="26" fill="#1A1A1A">
        <rect x="70" y="278" width="830" height="44" fill="#F2F2F2"/>
        <rect x="70" y="366" width="830" height="44" fill="#F2F2F2"/>
        <text x="80" y="168">Year</text>
        <text x="445" y="168" text-anchor="middle">2024</text>
        <text x="730" y="168" text-anchor="middle">2025</text>
        <text x="80" y="212">Brand</text>
        <g text-anchor="end">
          <text x="470" y="212">Sales Amount</text>
          <text x="580" y="212">YOY %</text>
          <text x="760" y="212">Sales Amount</text>
          <text x="870" y="212">YOY %</text>
        </g>
        <path d="M70 224h830" stroke="#2E75B6" stroke-width="2.5"/>
        <path d="M310 224v226" stroke="#2E75B6" stroke-width="1.5"/>
        <text x="80" y="260">A. Datum</text>
        <text x="80" y="304">Adventure Works</text>
        <text x="80" y="348">Contoso</text>
        <text x="80" y="392">Fabrikam</text>
        <text x="80" y="436">Litware</text>
        <g text-anchor="end">
          <text x="470" y="260">57,064.74</text><text x="580" y="260">119.91%</text>
          <text x="760" y="260">17,100.95</text><text x="870" y="260">-70.03%</text>
          <text x="470" y="304">363,393.96</text><text x="580" y="304">27.47%</text>
          <text x="760" y="304">182,123.25</text><text x="870" y="304">-49.88%</text>
          <text x="470" y="348">210,856.09</text><text x="580" y="348">12.17%</text>
          <text x="760" y="348">94,398.13</text><text x="870" y="348">-55.23%</text>
          <text x="470" y="392">172,102.36</text><text x="580" y="392">77.00%</text>
          <text x="760" y="392">74,722.24</text><text x="870" y="392">-56.58%</text>
          <text x="470" y="436">19,870.40</text><text x="580" y="436">-51.49%</text>
          <text x="760" y="436">13,308.30</text><text x="870" y="436">-33.02%</text>
        </g>
      </g>

      <!-- highlighter over the captured headers -->
      <g opacity="0.5">
        <rect x="320" y="186" width="158" height="32" rx="8" fill="#3ECFBB" transform="rotate(-0.7 399 202)"/>
        <rect x="610" y="186" width="158" height="32" rx="8" fill="#FFD84D" transform="rotate(0.6 689 202)"/>
        <rect x="790" y="186" width="88" height="32" rx="8" fill="#6FC1EE" transform="rotate(-0.8 834 202)"/>
      </g>

      <!-- captured DAX panel, overlapping the matrix -->
      <g>
        <rect x="360" y="470" width="860" height="280" rx="4" fill="#FDFDFE" stroke="#C9CCD3" filter="url(#panelshadow)"/>
        <rect x="360" y="470" width="860" height="46" rx="4" fill="#F4F4F6"/>
        <path d="M360 516h860" stroke="#DDDFE4" stroke-width="1.5"/>
        <text x="384" y="502" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#1A1A1A">DAX Code of YOY %</text>

        <!-- highlighter inside the code -->
        <g opacity="0.5">
          <rect x="388" y="528" width="112" height="30" rx="7" fill="#6FC1EE" transform="rotate(-0.8 444 543)"/>
          <rect x="508" y="560" width="196" height="30" rx="7" fill="#FFD84D" transform="rotate(0.6 606 575)"/>
          <rect x="574" y="624" width="206" height="30" rx="7" fill="#3ECFBB" transform="rotate(-0.5 677 639)"/>
        </g>

        <g font-family="Cascadia Mono, Consolas, monospace" font-size="22" fill="#1A1A1A">
          <text x="396" y="548" xml:space="preserve"><tspan fill="#B71D1D">YOY %</tspan> =</text>
          <text x="396" y="580" xml:space="preserve"><tspan fill="#0B6FB8">VAR</tspan> CY = [Sales Amount]</text>
          <text x="396" y="612" xml:space="preserve"><tspan fill="#0B6FB8">VAR</tspan> PY =</text>
          <text x="396" y="644" xml:space="preserve">  <tspan fill="#0B6FB8">CALCULATE</tspan> ( [Sales Amount], <tspan fill="#0B6FB8">PREVIOUSYEAR</tspan> ( <tspan fill="#A31515">'Date'[Date]</tspan> ) )</text>
          <text x="396" y="676" fill="#0B6FB8">RETURN</text>
          <text x="396" y="708" xml:space="preserve">  <tspan fill="#0B6FB8">DIVIDE</tspan> ( CY - PY, PY )</text>
        </g>
      </g>

      <!-- red pen over everything: circle the year, pull it into the measure -->
      <g fill="none" stroke="#E5442C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
        <path d="M786 142c-16-14-84-16-118 2-30 16-24 44 16 52 42 8 104 2 116-20 10-19-18-34-52-38"/>
        <path d="M742 206c-22 58-58 138-64 218-4 52 4 100 14 130"/>
        <path d="M672 516l20 38 34-20"/>
        <path d="M800 616c-14 14-22 32-6 44 22 16 118 20 236 12 100-7 172-22 178-40 6-19-60-32-160-34-96-2-198 4-238 16"/>
      </g>

      <!-- the floating pen palette -->
      <g transform="translate(980 120)">
        <rect x="0" y="0" width="340" height="264" rx="20" fill="#FBFBFC" stroke="#D5D8DE" stroke-width="1.5" filter="url(#panelshadow)"/>
        <!-- pen colors -->
        <g>
          <circle cx="34" cy="44" r="13" fill="#1F2328"/>
          <circle cx="74" cy="44" r="13" fill="#E2402F"/>
          <circle cx="74" cy="44" r="19" fill="none" stroke="#2563EB" stroke-width="3"/>
          <circle cx="114" cy="44" r="13" fill="#ECB33C"/>
          <circle cx="154" cy="44" r="13" fill="#5AACE8"/>
          <circle cx="194" cy="44" r="13" fill="#23A05A"/>
          <circle cx="234" cy="44" r="13" fill="#E070AC"/>
        </g>
        <rect x="258" y="24" width="40" height="40" rx="9" fill="#E4ECFA"/>
        <g fill="none" stroke="#374151" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M268 54l18-18M268 54l3-8 11 3z"/>
          <path d="M312 54l18-18M312 54l3-8 11 3z" stroke-width="2" opacity="0.75"/>
        </g>
        <!-- pen widths -->
        <g fill="#E2402F">
          <rect x="22" y="94" width="36" height="5" rx="2.5"/>
          <rect x="74" y="92" width="42" height="8" rx="4"/>
          <rect x="132" y="90" width="48" height="12" rx="6"/>
          <rect x="204" y="87" width="56" height="18" rx="9"/>
        </g>
        <rect x="122" y="78" width="68" height="36" rx="10" fill="none" stroke="#2563EB" stroke-width="3"/>
        <!-- highlighter colors -->
        <g>
          <circle cx="34" cy="152" r="13" fill="#F6C744"/>
          <circle cx="74" cy="152" r="13" fill="#F077A9"/>
          <circle cx="114" cy="152" r="13" fill="#56AEEA"/>
          <circle cx="154" cy="152" r="13" fill="#35C7B4"/>
          <circle cx="154" cy="152" r="19" fill="none" stroke="#2563EB" stroke-width="3"/>
        </g>
        <g fill="none" stroke="#374151" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M232 162l14-14 6 6-14 14zM230 164l-4 6 8-2z"/>
          <rect x="268" y="142" width="26" height="19" rx="3"/>
          <path d="M274 166h14"/>
        </g>
        <circle cx="322" cy="152" r="11" fill="none" stroke="#374151" stroke-width="2.4"/>
        <circle cx="322" cy="152" r="4.5" fill="#374151"/>
        <!-- highlighter widths -->
        <g fill="#35C7B4">
          <rect x="22" y="202" width="36" height="5" rx="2.5"/>
          <rect x="74" y="200" width="42" height="8" rx="4"/>
          <rect x="132" y="198" width="48" height="12" rx="6"/>
          <rect x="204" y="195" width="56" height="18" rx="9"/>
        </g>
        <rect x="122" y="186" width="68" height="36" rx="10" fill="none" stroke="#2563EB" stroke-width="3"/>
        <!-- eraser and move -->
        <g fill="none" stroke="#374151" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 250l12-12h12l6 6-12 12h-12zM24 250h30"/>
          <path d="M86 232v24M74 244h24M86 232l-5 5M86 232l5 5M86 256l-5-5M86 256l5-5M74 244l5-5M74 244l5 5M98 244l-5-5M98 244l-5 5"/>
        </g>
      </g>
    </g>
    <rect x="0" y="0" width="1400" height="900" rx="14" fill="none" stroke="#0A0C10" stroke-opacity=".18"/>
  </g>
</svg>
