# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Only the released channel is offered through winget. The pre-release channel exists so a
# tester can run it beside a released copy (decision 7); a package manager that installed
# it on `winget install SQLBI.Whiteboard` would defeat the point.
#
# Both scopes are listed, so `--scope user` installs without elevation. They are two
# distinct products with different UpgradeCodes, which is why each needs its own entry
# rather than one installer with a scope switch.
#
# InstallerType is wix rather than msi: the packages are WiX v5 output, and declaring it
# lets winget use the WiX silent switches instead of guessing at generic MSI ones.
#
# ProductCode is deliberately absent. WiX generates a new one per build because Version
# binds to the executable's file version, so a value written here would be wrong for every
# release except the one it was copied from. `wingetcreate update` reads it out of the
# downloaded MSI at submission time, which is the only way it can be right.
PackageIdentifier: SQLBI.Whiteboard
PackageVersion: 1.2.2
MinimumOSVersion: 10.0.19041.0
InstallerType: wix
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
ReleaseDate: '2026-09-02'
Installers:
- Architecture: x64
  Scope: machine
  InstallerUrl: https://github.com/sql-bi/SQLBI-Whiteboard/releases/download/v1.2.2/SQLBI.Whiteboard.1.2.2.x64.msi
  InstallerSha256: 10574E89368DA3E56A4C739C44096A2570F8C1FB9355344BAED197F1E1AA9A21
- Architecture: x64
  Scope: user
  InstallerUrl: https://github.com/sql-bi/SQLBI-Whiteboard/releases/download/v1.2.2/SQLBI.Whiteboard.1.2.2.x64-userinstaller.msi
  InstallerSha256: 2D5E25F28AA9820DA6D20DDFB640456FB4F6D5034E1F932A6DD0637EB816B3ED
ManifestType: installer
ManifestVersion: 1.6.0
