# Builds, signs, packages, and publishes SQLBI Whiteboard.
#
# Every merge to main publishes the pre-release channel to a GitHub prerelease. The same
# run can then be promoted to a full release by approving the Release stage, which uploads
# the released-channel installers that run already produced - nothing is rebuilt, so what
# ships is what was tested. See docs/decisions.md, decisions 9 and 10.
#
# Both variable groups live in the 'SQLBI Whiteboard' Azure DevOps project. Signing is
# kept in its own group so that group's Security can be restricted independently of the
# rest of the build settings.
#
#   SQLBI-CodeSigning
#     SigningVaultURL, SigningTenantId, SigningClientId, SigningClientSecret, SigningCertName
#     The certificate is the shared SQLBI one, held in Azure Key Vault and reached through a
#     Whiteboard-specific service principal so access can be revoked on its own.
#
#   SQLBI.Whiteboard
#     AppInformationalVersionExtendedInfo  (optional, 'true' appends build and commit details)
#
#   SQLBI-StoreSubmission
#     StoreTenantId, StoreClientId, StoreClientSecret, StoreSellerId
#     Declared on the Store stage rather than here, so the build and signing stages cannot
#     read it. Its tenant is not the signing tenant: the Partner Center account is
#     associated with a different one.
#
# The version is not a pipeline variable: it comes from VersionPrefix in
# Directory.Build.props, so releasing is a reviewed change to the repository.

parameters:
- name: verbosity
  displayName: Verbosity
  type: string
  default: normal
  values: [minimal, normal, detailed, diagnostic]
- name: sign
  displayName: Code sign the outputs
  type: boolean
  default: true
# Turn off to promote a release without touching the Store - when a submission is already
# pending for the product, or when the release is being rebuilt rather than shipped.
- name: submitToStore
  displayName: Submit the released MSIX to the Microsoft Store
  type: boolean
  default: true

# Documentation-only changes do not need a signed build. Path filters are prefixes, not
# globs: Azure DevOps supports wildcards in branch and tag filters but not in path filters,
# so every entry here names a directory or a file exactly.
trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - docs
    - .github
    - site
    - README.md
    - CONTRIBUTING.md
    - TODO.md
    - CLAUDE.md
    - AGENTS.md
    - vscode
    - .gitignore
    # Distribution metadata, not product. The winget manifests describe a release that
    # already exists, and the manifest generator runs in the Pages deployment; neither
    # goes into a build, so a change to either would otherwise publish a pre-release
    # that is byte-identical to the one before it.
    - installer/winget
    - scripts/build-release-manifests.ps1

# Pull requests are validated by .github/workflows/pull-request.yml, unsigned. Without this,
# Azure DevOps validates every pull request against a GitHub repository by default, which
# would run a signed build over unreviewed code.
pr: none

variables:
- group: 'SQLBI-CodeSigning'
- group: 'SQLBI.Whiteboard'
- name: configuration
  value: 'Release'
- name: csproj
  value: 'src/SQLBI.Whiteboard/SQLBI.Whiteboard.csproj'
- name: installerRoot
  value: '$(Build.SourcesDirectory)/installer/wix'
- name: timestampUrl
  value: 'http://timestamp.digicert.com'
# Keep in step with the wix tool version pinned in .config/dotnet-tools.json.
- name: wixVersion
  value: '5.0.2'
- name: gitHubConnection
  value: 'sql-bi write assets'
- name: isMain
  value: $[ eq(variables['Build.SourceBranch'], 'refs/heads/main') ]

stages:
- stage: Build
  displayName: Build and package
  jobs:
  - job: Package
    pool:
      vmImage: 'windows-latest'
    strategy:
      matrix:
        whiteboard-x64:
          arch: 'x64'
          selfcontained: 'true'
          flavor: ''
        whiteboard-x64-frameworkdependent:
          arch: 'x64'
          selfcontained: 'false'
          flavor: '-frameworkdependent'
    steps:
    - task: UseDotNet@2
      displayName: 'Use .NET 10 SDK'
      inputs:
        packageType: sdk
        version: '10.0.x'

    - script: dotnet restore "$(csproj)" --runtime "win-$(arch)" --verbosity "${{ parameters.verbosity }}"
      displayName: 'dotnet restore'

    - task: PowerShell@2
      displayName: 'Set version variables'
      inputs:
        targetType: 'inline'
        script: |
          # Pipeline variables are read from the environment rather than interpolated into this
          # script. An undefined $(Name) macro is left verbatim, and PowerShell then treats
          # "$(Name)" as a subexpression and tries to run Name as a command.
          $extendedInfo = $env:APP_INFORMATIONAL_VERSION_EXTENDED_INFO

          # The product version comes from VersionPrefix in Directory.Build.props, so it is
          # reviewed in a pull request rather than edited in a variable group.
          $semVer = (dotnet msbuild "$env:PROJECT_FILE" -getProperty:VersionPrefix --nologo).Trim()
          if ($semVer -notmatch '^\d+\.\d+\.\d+$') {
              throw "VersionPrefix in Directory.Build.props must be major.minor.patch, but reads '$semVer'."
          }
          $semVerParts = $semVer.Split('.')

          # Built with -f rather than interpolation: in "$env:BUILD_BUILDID?api-version=1"
          # PowerShell reads '?' as part of the variable name and the id disappears.
          # The build start time comes from the server so every matrix job stamps the same version.
          $url = '{0}{1}/_apis/build/builds/{2}?api-version=7.1' -f $env:SYSTEM_COLLECTIONURI, $env:SYSTEM_TEAMPROJECTID, $env:BUILD_BUILDID
          try {
              $build = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } -Method Get -ErrorAction Stop
          }
          catch {
              throw "Could not read build details from $url - $($_.Exception.Message)"
          }
          $buildTime = [datetime]$build.startTime
          $buildNumberRevision = $build.buildNumberRevision
          $midnightTime = (Get-Date -Year $buildTime.Year -Month $buildTime.Month -Day $buildTime.Day -Hour 0 -Minute 0 -Second 0 -Millisecond 0)
          # Build Number - number of days since 2000-01-01 (same algorithm as msbuild)
          $versionBuild = (New-TimeSpan -Start ([datetime]"2000-01-01") -End $buildTime).Days
          # Revision - number of seconds since midnight divided by 2 (same algorithm as msbuild)
          $versionRevision = [math]::Round((New-TimeSpan -Start $midnightTime -End $buildTime).TotalSeconds / 2)
          $buildNumber = '{0:yyyyMMdd}.{1}' -f $buildTime, $buildNumberRevision
          $versionNumber = '{0}.{1}.{2}.{3}' -f $semVerParts[0], $semVerParts[1], $versionBuild, $versionRevision
          $informationalVersion = $semVer
          $artifact = 'SQLBI.Whiteboard.{0}.{1}{2}' -f $semVer, $env:MATRIX_ARCH, $env:MATRIX_FLAVOR
          if ($extendedInfo -eq 'true') {
              $informationalVersion += '-{0}-{1}-{2}-{3}' -f $buildNumber, $versionNumber, $env:BUILD_SOURCEBRANCHNAME, $env:BUILD_SOURCEVERSION
          }
          Write-Host "##vso[task.setvariable variable=artifact;]$artifact"
          Write-Host "##vso[task.setvariable variable=AppSemVer;]$semVer"
          Write-Host "##vso[task.setvariable variable=AppBuildNumber;]$buildNumber"
          Write-Host "##vso[task.setvariable variable=AppVersionNumber;]$versionNumber"
          Write-Host "##vso[task.setvariable variable=AppInformationalVersion;]$informationalVersion"
          Write-Host "##vso[build.updatebuildnumber]$buildNumber-$versionNumber"
          Write-Host "Version is $semVer, assembly version $versionNumber"
          Write-Host "Artifact is $artifact"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        PROJECT_FILE: $(csproj)
        MATRIX_ARCH: $(arch)
        MATRIX_FLAVOR: $(flavor)
        # Optional; an undefined macro arrives here as a harmless literal string.
        APP_INFORMATIONAL_VERSION_EXTENDED_INFO: $(AppInformationalVersionExtendedInfo)

    - script: >-
        dotnet publish "$(csproj)"
        --configuration "$(configuration)"
        --no-restore
        --runtime "win-$(arch)"
        --self-contained "$(selfcontained)"
        --output "$(Build.BinariesDirectory)"
        --verbosity "${{ parameters.verbosity }}"
        -p:Version="$(AppVersionNumber)"
        -p:InformationalVersion="$(AppInformationalVersion)"
        -p:ContinuousIntegrationBuild=true
        -p:DebugType=none
      displayName: 'dotnet publish'

    - script: >-
        dotnet publish "src/SQLBI.Whiteboard.ThumbnailHandler/SQLBI.Whiteboard.ThumbnailHandler.csproj"
        --configuration "$(configuration)"
        --runtime "win-$(arch)"
        --self-contained true
        --output "$(Build.BinariesDirectory)\thumbnail-aot"
        --verbosity "${{ parameters.verbosity }}"
        -p:Version="$(AppVersionNumber)"
        -p:InformationalVersion="$(AppInformationalVersion)"
        -p:ContinuousIntegrationBuild=true
        -p:DebugType=none
        && copy /Y "$(Build.BinariesDirectory)\thumbnail-aot\SQLBI.Whiteboard.ThumbnailHandler.dll" "$(Build.BinariesDirectory)\"
      displayName: 'dotnet publish thumbnail handler'

    - ${{ if parameters.sign }}:
      - script: dotnet tool install --global AzureSignTool
        displayName: 'Install AzureSignTool'

      # Signed before packaging so the MSI and the ZIP both carry the signed binaries.
      - task: CmdLine@2
        displayName: 'Code signing application binaries'
        inputs:
          script: >-
            AzureSignTool sign
            -kvu "$(SigningVaultURL)"
            -kvt "$(SigningTenantId)"
            -kvi "$(SigningClientId)"
            -kvs "$(SigningClientSecret)"
            -kvc "$(SigningCertName)"
            -tr "$(timestampUrl)"
            -v
            "$(Build.BinariesDirectory)\SQLBI.Whiteboard.exe"
            "$(Build.BinariesDirectory)\SQLBI.Whiteboard.Core.dll"
            "$(Build.BinariesDirectory)\SQLBI.Whiteboard.Dax.dll"
            "$(Build.BinariesDirectory)\SQLBI.Whiteboard.SqlServer.dll"
            "$(Build.BinariesDirectory)\SQLBI.Whiteboard.ThumbnailHandler.dll"
          failOnStderr: true

    - script: dotnet tool restore
      displayName: 'Restore the pinned WiX toolset'
      workingDirectory: '$(Build.SourcesDirectory)'

    # WiX extensions are per-machine state, not part of the tool manifest, so a fresh
    # hosted agent has none. Adding an extension that is already present is a no-op.
    - script: >-
        dotnet wix extension add -g WixToolset.UI.wixext/$(wixVersion)
        && dotnet wix extension add -g WixToolset.Util.wixext/$(wixVersion)
        && dotnet wix extension list -g
      displayName: 'Add the WiX extensions'
      workingDirectory: '$(Build.SourcesDirectory)'

    # The same script the pull request validation runs, packaging the binaries signed above
    # rather than publishing its own. Sharing one code path is why the pipeline no longer
    # invokes wix directly: the two drifted apart the last time the authoring gained a
    # preprocessor variable.
    - task: PowerShell@2
      displayName: 'Build installers'
      inputs:
        filePath: '$(Build.SourcesDirectory)/scripts/build-installer.ps1'
        arguments: >-
          -Version "$(AppSemVer)"
          -Architecture "$(arch)"
          -SelfContained "$(selfcontained)"
          -PublishFolder "$(Build.BinariesDirectory)"
          -OutputFolder "$(Build.ArtifactStagingDirectory)"
        workingDirectory: '$(Build.SourcesDirectory)'
        pwsh: true

    - ${{ if parameters.sign }}:
      - task: PowerShell@2
        displayName: 'Code signing MSI packages'
        inputs:
          targetType: 'inline'
          pwsh: true
          script: |
            $packages = Get-ChildItem "$env:STAGING\*.msi" | ForEach-Object { $_.FullName }
            if (-not $packages) { throw "No MSI packages found in $env:STAGING" }
            AzureSignTool sign `
              -kvu $env:VAULT_URL -kvt $env:TENANT_ID -kvi $env:CLIENT_ID `
              -kvs $env:CLIENT_SECRET -kvc $env:CERT_NAME `
              -tr $env:TIMESTAMP_URL -v @packages
            if ($LASTEXITCODE -ne 0) { throw "Signing failed with exit code $LASTEXITCODE" }
        env:
          STAGING: $(Build.ArtifactStagingDirectory)
          VAULT_URL: $(SigningVaultURL)
          TENANT_ID: $(SigningTenantId)
          CLIENT_ID: $(SigningClientId)
          CLIENT_SECRET: $(SigningClientSecret)
          CERT_NAME: $(SigningCertName)
          TIMESTAMP_URL: $(timestampUrl)

    - publish: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Publish artifacts to the pipeline'
      artifact: 'drop-$(arch)-$(selfcontained)'

# Both publishing stages read the version from the repository rather than carrying it
# across stage boundaries, which is possible because Directory.Build.props is the single
# definition (decision 8).
- stage: PreRelease
  displayName: Publish pre-release
  dependsOn: Build
  condition: and(succeeded(), eq(variables.isMain, true))
  jobs:
  - job: Publish
    displayName: Publish to a GitHub prerelease
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    - download: current
      displayName: 'Download the packaged artifacts'

    - template: templates/collect-release-assets.yml
      parameters:
        channel: dev

    - task: GitHubRelease@1
      displayName: 'Create the GitHub prerelease'
      inputs:
        gitHubConnection: '$(gitHubConnection)'
        repositoryName: '$(Build.Repository.Name)'
        action: create
        target: '$(Build.SourceVersion)'
        tagSource: userSpecifiedTag
        # Unique per run, so successive pre-releases of one version do not collide.
        tag: 'v$(AppSemVer)-dev.$(Build.BuildId)'
        title: 'SQLBI Whiteboard $(AppSemVer) (dev $(Build.BuildId))'
        releaseNotesSource: inline
        releaseNotes: |
          Pre-release build of SQLBI Whiteboard $(AppSemVer).

          Installs alongside a released copy as **SQLBI Whiteboard (Dev)**, with its own
          settings, and does not take over the `.wboard` file type.
        assets: '$(Build.ArtifactStagingDirectory)/release/*'
        isPreRelease: true
        # Off because with no previous release the task tries to build a changelog spanning
        # every commit from the initial one, which fails. The notes above say what matters.
        addChangeLog: false

- stage: Release
  displayName: Promote to released
  dependsOn: Build
  condition: and(succeeded(), eq(variables.isMain, true))
  jobs:
  - deployment: Promote
    displayName: Publish the released channel
    # The approvals configured on this environment are the promotion gate. If the
    # environment does not exist Azure DevOps creates one silently, and an auto-created
    # environment has no approvals - so confirm the name matches before trusting the gate.
    environment: whiteboard-release
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            displayName: 'Download the packaged artifacts'

          - template: templates/collect-release-assets.yml
            parameters:
              channel: stable

          - task: GitHubRelease@1
            displayName: 'Create the GitHub release'
            inputs:
              gitHubConnection: '$(gitHubConnection)'
              repositoryName: '$(Build.Repository.Name)'
              action: create
              target: '$(Build.SourceVersion)'
              tagSource: userSpecifiedTag
              # Fails if the tag exists, which is the intended guard against releasing the
              # same version twice: bump VersionPrefix instead.
              tag: 'v$(AppSemVer)'
              title: 'SQLBI Whiteboard $(AppSemVer)'
              releaseNotesSource: inline
              releaseNotes: |
                SQLBI Whiteboard $(AppSemVer).
              assets: '$(Build.ArtifactStagingDirectory)/release/*'
              isPreRelease: false
              addChangeLog: false

# Submission runs after the release rather than beside it. Certification takes hours to
# days, so it must never gate the download (decision 13) - by the time this stage starts,
# the GitHub release already exists and a failure here changes nothing that shipped.
# Depending on Release also means a build that was never promoted is never submitted.
- stage: Store
  displayName: Submit to the Microsoft Store
  dependsOn: Release
  condition: and(succeeded(), eq(variables.isMain, true), ${{ parameters.submitToStore }})
  # The Store credential is scoped to this stage. The build and signing stages have no use
  # for it, and a variable group declared at pipeline level is readable by all of them.
  #
  #   SQLBI-StoreSubmission
  #     StoreTenantId, StoreClientId, StoreClientSecret, StoreSellerId
  #
  # The tenant is deliberately not SigningTenantId: the Partner Center account SQLBI Corp
  # is associated with a different Microsoft Entra tenant than the one this pipeline signs
  # in. That is also why the names carry a Store prefix - two groups defining a bare
  # TenantId would collide, and Azure DevOps resolves a collision silently.
  variables:
  - group: 'SQLBI-StoreSubmission'
  # Public: it is the address of the listing, apps.microsoft.com/detail/9NN5N0L2TMTF.
  - name: storeProductId
    value: '9NN5N0L2TMTF'
  jobs:
  - job: Submit
    displayName: Submit the released MSIX
    # windows-latest for parity with the Build stage. The CLI is cross-platform, but its
    # Linux build needs a matching .NET runtime present on the agent, which is one more
    # thing to keep in step for no gain here.
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: none

    # Only the self-contained artifact. Both matrix jobs pack a stable MSIX and
    # build-msix.ps1 names them identically - SQLBI.Whiteboard.<version>.x64.msix carries
    # no flavour - so a recursive search over the whole workspace can just as easily find
    # the framework-dependent copy and submit a package that needs a .NET runtime nobody
    # installed. Naming the artifact makes that mistake unreachable.
    - download: current
      displayName: 'Download the released-channel package'
      artifact: 'drop-x64-true'

    - task: PowerShell@2
      displayName: 'Locate the MSIX'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $packages = @(Get-ChildItem -Path $env:ARTIFACT -Filter '*.msix' -File)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one MSIX in $env:ARTIFACT, found $($packages.Count)."
          }

          $msix = $packages[0]
          Write-Host ('Submitting {0} ({1:N1} MB)' -f $msix.Name, ($msix.Length / 1MB))
          Write-Host "##vso[task.setvariable variable=MsixPath;]$($msix.FullName)"
      env:
        ARTIFACT: $(Pipeline.Workspace)/drop-x64-true

    - task: UseMSStoreCLI@0
      displayName: 'Install the Microsoft Store Developer CLI'

    # Credentials go through the environment rather than the command line: a native command
    # line is echoed by the agent, and masking is a safety net rather than a guarantee.
    - task: PowerShell@2
      displayName: 'Configure the Store CLI'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          msstore reconfigure `
              --tenantId $env:STORE_TENANT_ID `
              --sellerId $env:STORE_SELLER_ID `
              --clientId $env:STORE_CLIENT_ID `
              --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with $LASTEXITCODE" }
      env:
        STORE_TENANT_ID: $(StoreTenantId)
        STORE_SELLER_ID: $(StoreSellerId)
        STORE_CLIENT_ID: $(StoreClientId)
        STORE_CLIENT_SECRET: $(StoreClientSecret)

    # Packages only. The listing text, screenshots, and 'What's new' are carried over from
    # the last published submission untouched; changing them is 'msstore submission
    # updateMetadata' and a deliberate act, recorded in installer/msix/STORE-LISTING.md.
    #
    # This fails if a submission is already pending for the product. That is correct: an
    # in-flight submission may be someone's manual listing edit, and a pipeline must not
    # discard it. Resolve it in Partner Center, then re-run this stage.
    - task: PowerShell@2
      displayName: 'Submit the package'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          msstore publish $env:MSIX_PATH -id $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
              throw "msstore publish exited with $LASTEXITCODE. A pending submission in Partner Center is the usual cause; the release itself is unaffected."
          }

          Write-Host 'Submitted. Certification takes hours to days and is tracked in Partner Center.'
      env:
        MSIX_PATH: $(MsixPath)
        STORE_PRODUCT_ID: $(storeProductId)
